name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          files=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Dependency boundaries
        shell: bash
        run: |
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' github.com/imbrooklyn/rulite)
          test "$deps" = github.com/imbrooklyn/rulite
          go mod verify
      - name: Benchmark tooling tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Fuzz smoke
        shell: bash
        run: |
          for target in FuzzCompileMetadata FuzzRuleValidation FuzzExecutionOutcomes FuzzCombinatorNesting FuzzExecutionErrorTree FuzzObservationStream FuzzGroupExecution FuzzRuntimePublications; do
            go test . -run '^$' -fuzz "^${target}$" -fuzztime=5s -parallel=2 || exit 1
          done
          for target in FuzzNativeComparison FuzzBoundedCompile FuzzTypedMapping; do
            go test ./cel -run '^$' -fuzz "^${target}$" -fuzztime=5s -parallel=2 || exit 1
          done
          for target in FuzzDefinitionsJSON FuzzDefinitionFieldsAndParams; do
            go test ./dynamic -run '^$' -fuzz "^${target}$" -fuzztime=5s -parallel=2 || exit 1
          done
          go test ./otel -run '^$' -fuzz '^FuzzTelemetryProjection$' -fuzztime=5s -parallel=2

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      - name: Structural allocation and ownership gates
        working-directory: candidate
        run: go test . -run '^(TestSparseAllMissAllocation|TestSparseGroupHoles|TestMetadataDoesNotRetainExecutables|TestRuleSetSharesExecutableSnapshot)$' -count=1 -v
      - name: Repeated benchmark samples
        working-directory: candidate
        env:
          REPORT_DIR: ${{ runner.temp }}/benchmark-results
          BASELINE_DIR: ${{ github.workspace }}/baseline
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          options=()
          if [ "$EVENT_NAME" = pull_request ]; then
            options+=(--baseline "$BASELINE_DIR")
          fi
          python3 -B scripts/benchmarks.py "$REPORT_DIR" --samples 6 --benchtime 100ms "${options[@]}"
      - name: CEL compile and evaluation samples
        working-directory: candidate
        env:
          REPORT_DIR: ${{ runner.temp }}/benchmark-results
        shell: bash
        run: |
          go test ./cel -run '^$' -bench . -benchmem -benchtime=100ms -count=3 > "$REPORT_DIR/cel-benchmarks.txt"
      - name: Atomic snapshot samples
        working-directory: candidate
        env:
          REPORT_DIR: ${{ runner.temp }}/benchmark-results
        shell: bash
        run: |
          go test . -run '^$' -bench '^(BenchmarkSnapshotFire|BenchmarkRuntimePublish|BenchmarkRuntimeConcurrentSwap)$' -benchmem -benchtime=100ms -count=3 > "$REPORT_DIR/runtime-benchmarks.txt"
      - name: Dynamic construction and runtime samples
        working-directory: candidate
        env:
          REPORT_DIR: ${{ runner.temp }}/benchmark-results
        shell: bash
        run: |
          go test ./dynamic -run '^$' -bench . -benchmem -benchtime=100ms -count=3 > "$REPORT_DIR/dynamic-benchmarks.txt"
      - name: OpenTelemetry observation samples
        working-directory: candidate
        env:
          REPORT_DIR: ${{ runner.temp }}/benchmark-results
        shell: bash
        run: |
          go test ./otel -run '^$' -bench . -benchmem -benchtime=100ms -count=3 > "$REPORT_DIR/otel-benchmarks.txt"
      - name: Upload benchmark samples and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/benchmark-results
          if-no-files-found: warn
          retention-days: 14
